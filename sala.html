<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Noite Vermelha — Mesa com amigos</title><link rel="stylesheet" href="assets/css/logo.css"><link rel="stylesheet" href="assets/css/room.css"></head><body><header><a href="index.html" aria-label="Início"><span class="logo-mask brand-logo"></span></a><span id="connection">Mesa com amigos</span><button id="invite" hidden>Convidar</button><button id="leave" hidden>Sair</button></header><main id="lobby"><h1>Uma mesa.<br>Quatro destinos.</h1><form id="roomForm"><label>Seu nome<input id="nickname" required maxlength="40" autocomplete="nickname"></label><label>Personagem<select id="character"><option value="">Conduzir como Mestre</option><option value="damiao">Damião</option><option value="baltazar">Baltazar</option><option value="turak">Turak</option><option value="octavio">Octávio</option></select></label><label>Código da sala <small>(vazio para criar)</small><input id="roomId" pattern="[a-f0-9]{16}" maxlength="16"></label><label>Senha da mesa<input id="password" type="password" required minlength="4" maxlength="128" autocomplete="current-password"></label><button id="enterRoom">Entrar na noite</button></form><p id="error" role="alert"></p><a href="index.html">Voltar à abertura</a></main><section id="table" hidden><iframe id="board" title="Tabuleiro compartilhado Owlbear" allow="fullscreen"></iframe><nav id="hud" aria-label="HUD da mesa"><button data-panel="scene">Cena</button><button data-panel="clues">Caderno</button><button data-panel="notes">Anotações</button><button data-panel="dice">Dados</button><button data-panel="party">Grupo</button><button data-panel="gm" id="gmHud" hidden>Mestre</button></nav><aside id="hudPanel" hidden><div class="panel-top"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="Fechar painel">×</button></div><div id="panelBody"></div><nav id="pager"><button id="prev">←</button><span id="pageCount"></s
