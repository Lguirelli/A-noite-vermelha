<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ campaign.name if campaign else 'Mesa' }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="table-body">
  <header class="topbar"><strong>A NOITE VERMELHA</strong><span>{{ user.name }} • {{ user.role }}</span></header>
  <main class="table-layout">
    <section id="table" class="table" data-campaign="{{ campaign.id if campaign else '' }}" data-user="{{ user.id }}" data-scene="{{ scene.id if scene else '' }}">
      {% if scene %}<div class="scene-title">{{ scene.name }}</div>{% else %}<div class="empty">O Mestre ainda não ativou uma cena.</div>{% endif %}
    </section>
    <aside class="sidebar">
      <h2>Presença</h2>
      <p>Camadas privadas, pistas e mensagens aparecerão aqui.</p>
      <div id="events"></div>
    </aside>
  </main>
  <script src="/static/js/tabletop.js"></script>
</body>
</html>
